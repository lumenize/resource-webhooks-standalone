# The 2026-07-28 checks A is known to fail, for `npm run conformance`. Each names a feature
# this prototype has no use for. The suite fails the run on any failure not listed here, and on
# any listed one that starts to pass.
server:
  # A offers no prompts or completions.
  - completion-complete:completion-complete
  - prompts-list:prompts-list
  - prompts-get-simple:prompts-get-simple
  - prompts-get-with-args:prompts-get-with-args
  - prompts-get-embedded-resource:prompts-get-embedded-resource
  - prompts-get-with-image:prompts-get-with-image
  - caching:sep-2549-prompts-list-caching-hints
  # A answers every request in JSON, so it has no stream to send progress on.
  - tools-call-with-progress:tools-call-with-progress
  # A asks a client for no input, so it never answers with an InputRequiredResult.
  - input-required-result-basic-elicitation:sep-2322-elicitation-incomplete
  - input-required-result-basic-sampling:sep-2322-sampling-incomplete
  - input-required-result-basic-list-roots:sep-2322-list-roots-incomplete
  - input-required-result-request-state:sep-2322-request-state-incomplete
  - input-required-result-multiple-input-requests:sep-2322-multiple-inputs-incomplete
  - input-required-result-multi-round:sep-2322-multi-round-r1
  - input-required-result-missing-input-response:sep-2322-missing-response-rerequests
  - input-required-result-non-tool-request:sep-2322-non-tool-incomplete
  - input-required-result-result-type:sep-2322-result-type-included
  - input-required-result-tampered-state:sep-2322-reject-tampered-state
  - input-required-result-capability-check:sep-2322-respect-client-capabilities
  - input-required-result-ignore-extra-params:sep-2322-ignore-unexpected-params
client:
  # The client speaks one protocol version, so it has no other to retry with.
  - request-metadata:sep-2575-client-retry-supported-version
  # It registers by Dynamic Client Registration, as A's authorization server needs, and hosts
  # no client ID metadata document.
  - auth/basic-cimd:cimd-client-id-used
  # It sends no inputResponses, since A asks a client for no input.
  - sep-2322-client-request-state:sep-2322-client-jsonrpc-id-different
  - sep-2322-client-request-state:sep-2322-client-no-state-omitted
  - sep-2322-client-request-state:sep-2322-client-parallel-isolation
  - sep-2322-client-request-state:sep-2322-client-request-state-echoed
  - sep-2322-client-request-state:sep-2322-default-result-type-complete
  # It mirrors no arguments into Mcp-Param headers, since A's tools declare none.
  - http-custom-headers:sep-2243-client-base64-unsafe
  - http-custom-headers:sep-2243-client-encode-values
  - http-custom-headers:sep-2243-client-omit-null
  - http-custom-headers:sep-2243-client-supports-custom-headers
